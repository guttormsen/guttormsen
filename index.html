<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lykkelig tur – finn turen din</title>
    <meta
      name="description"
      content="Finn og planlegg turer i Norge på Kartverkets kart. Ekte turforslag fra den nasjonale rutebasen, høydeprofil, vær langs ruta og turdagbok."
    />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="src/css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#panel">Hopp til turpanelet</a>

    <header class="topbar">
      <h1 class="brand">
        <span class="brand__mark" aria-hidden="true">▲</span>
        <span class="brand__name">Lykkelig tur</span>
      </h1>

      <div class="search" role="search">
        <label class="visually-hidden" for="search-input">Søk etter fjell, hytte, vann eller sted</label>
        <input
          id="search-input"
          class="search__input"
          type="search"
          placeholder="Hvor vil du gå?"
          autocomplete="off"
          spellcheck="false"
        />
        <ul id="search-results" class="search__list" hidden></ul>
        <p id="search-status" class="visually-hidden" role="status" aria-live="polite"></p>
      </div>
    </header>

    <main class="app">
      <div class="map-wrap">
        <div id="map" class="map" role="application" aria-label="Kart. Klikk for å sette veipunkt."></div>

        <div class="map-tools">
          <button id="btn-locate" class="map-btn" type="button" title="Vis hvor jeg er">
            <span aria-hidden="true">◎</span><span class="visually-hidden">Vis hvor jeg er</span>
          </button>
          <button
            id="btn-layers"
            class="map-btn"
            type="button"
            title="Kartlag"
            aria-expanded="false"
            aria-controls="layer-popover"
          >
            <span aria-hidden="true">▤</span><span class="visually-hidden">Kartlag</span>
          </button>
          <button id="btn-draw" class="map-btn" type="button" title="Tegn din egen rute" aria-pressed="false">
            <span aria-hidden="true">✏️</span><span class="visually-hidden">Tegn din egen rute</span>
          </button>
        </div>

        <div id="layer-popover" class="popover" role="dialog" aria-label="Kartlag" hidden></div>

        <p id="trail-label" class="trail-label" role="status" aria-live="polite" hidden></p>

        <section id="trail-preview" class="preview" aria-label="Valgt sti" hidden></section>

        <button id="btn-start" class="pill pill--start" type="button" hidden>
          <span aria-hidden="true">▶</span> Start turen
        </button>

        <div class="map-overlay">
          <button id="btn-search-here" class="pill pill--action" type="button" hidden>
            <span aria-hidden="true">🔍</span> Finn turer her
          </button>
          <div id="draw-tools" class="draw-tools" hidden>
            <button id="btn-undo" class="pill" type="button" title="Angre siste punkt">
              <span aria-hidden="true">↩</span> Angre
            </button>
            <button id="btn-clear" class="pill" type="button" title="Fjern hele ruta">
              <span aria-hidden="true">✕</span> Tøm
            </button>
          </div>
        </div>
      </div>

      <aside id="panel" class="panel" aria-label="Turpanel" data-sheet="peek">
        <div id="sheet-grab" class="sheet-grab">
          <button id="sheet-handle" class="sheet-handle" type="button" aria-expanded="false" aria-controls="panel">
            <span class="sheet-handle__grip" aria-hidden="true"></span>
            <span class="visually-hidden">Dra opp eller ned for å vise mer eller mindre</span>
          </button>

          <section id="nav-bar" class="navbar" aria-label="Turen underveis" aria-live="polite" hidden></section>

          <nav class="tabs" aria-label="Seksjoner">
            <button class="tab is-active" type="button" data-tab="finn" aria-selected="true">
              <span aria-hidden="true">🧭</span> Finn tur
            </button>
            <button class="tab" type="button" data-tab="turen" aria-selected="false">
              <span aria-hidden="true">🥾</span> Turen
            </button>
            <button class="tab" type="button" data-tab="dagbok" aria-selected="false">
              <span aria-hidden="true">📖</span> Dagbok
            </button>
          </nav>
        </div>

        <div id="route-header" class="route-header" hidden>
          <section class="stats" id="stats" aria-live="polite"></section>
          <section class="profile" aria-label="Høydeprofil">
            <div id="profile" class="profile__box"></div>
          </section>
        </div>

        <div class="panes">
          <div class="pane" id="pane-finn" data-pane="finn"></div>
          <div class="pane" id="pane-turen" data-pane="turen" hidden></div>
          <div class="pane" id="pane-dagbok" data-pane="dagbok" hidden></div>
        </div>

        <footer id="panel-footer" class="panel__footer" hidden></footer>
      </aside>
    </main>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="src/js/main.js"></script>
    <noscript>
      <p class="noscript">Lykkelig tur trenger JavaScript for å tegne kart og regne ut ruter.</p>
    </noscript>
  </body>
</html>
