<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Turplan – planlegg turen på ekte kart</title>
    <meta
      name="description"
      content="Planlegg fotturen på Kartverkets kart med merkede stier fra Turrutebasen. Ekte høydeprofil, realistisk tidsbruk, vær langs ruta og dagslyssjekk."
    />
    <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="src/css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#panel">Hopp til turpanelet</a>

    <header class="topbar">
      <h1 class="brand">
        <span class="brand__mark" aria-hidden="true">▲</span>
        <span class="brand__name">Turplan</span>
      </h1>

      <div class="search" role="search">
        <label class="visually-hidden" for="search-input">Søk etter fjell, hytte, vann eller sted</label>
        <input
          id="search-input"
          class="search__input"
          type="search"
          placeholder="Søk: Gaustatoppen, Gjendesheim, Preikestolen …"
          autocomplete="off"
          spellcheck="false"
        />
        <ul id="search-results" class="search__list" hidden></ul>
        <p id="search-status" class="visually-hidden" role="status" aria-live="polite"></p>
      </div>

      <div class="topbar__actions">
        <button id="btn-locate" class="icon-btn" type="button" title="Vis min posisjon">
          <span aria-hidden="true">◎</span><span class="visually-hidden">Vis min posisjon</span>
        </button>
        <button id="btn-undo" class="icon-btn" type="button" title="Angre siste punkt" disabled>
          <span aria-hidden="true">↩</span><span class="visually-hidden">Angre siste punkt</span>
        </button>
        <button id="btn-clear" class="icon-btn" type="button" title="Tøm ruta" disabled>
          <span aria-hidden="true">✕</span><span class="visually-hidden">Tøm ruta</span>
        </button>
      </div>
    </header>

    <main class="app">
      <div id="map" class="map" role="application" aria-label="Kart. Klikk for å sette veipunkt."></div>

      <aside id="panel" class="panel" aria-label="Turpanel">
        <button id="sheet-handle" class="sheet-handle" type="button" aria-expanded="false" aria-controls="panel">
          <span class="sheet-handle__grip" aria-hidden="true"></span>
          <span class="visually-hidden">Vis eller skjul turpanelet</span>
        </button>

        <section class="stats" id="stats" aria-live="polite"></section>

        <section class="profile" aria-label="Høydeprofil">
          <div id="profile" class="profile__box"></div>
          <p id="profile-empty" class="profile__empty">
            Klikk i kartet for å sette startpunktet. Neste klikk lager en strekning.
          </p>
        </section>

        <nav class="tabs" aria-label="Seksjoner">
          <button class="tab is-active" type="button" data-tab="plan" aria-selected="true">Plan</button>
          <button class="tab" type="button" data-tab="vaer" aria-selected="false">Vær</button>
          <button class="tab" type="button" data-tab="sikkerhet" aria-selected="false">Sikkerhet</button>
          <button class="tab" type="button" data-tab="rute" aria-selected="false">Langs ruta</button>
          <button class="tab" type="button" data-tab="kart" aria-selected="false">Kart</button>
          <button class="tab" type="button" data-tab="turer" aria-selected="false">Turer</button>
        </nav>

        <div class="panes">
          <div class="pane" id="pane-plan" data-pane="plan"></div>
          <div class="pane" id="pane-vaer" data-pane="vaer" hidden></div>
          <div class="pane" id="pane-sikkerhet" data-pane="sikkerhet" hidden></div>
          <div class="pane" id="pane-rute" data-pane="rute" hidden></div>
          <div class="pane" id="pane-kart" data-pane="kart" hidden></div>
          <div class="pane" id="pane-turer" data-pane="turer" hidden></div>
        </div>

        <footer class="panel__footer">
          <div class="panel__buttons">
            <button id="btn-save" class="btn" type="button">Lagre</button>
            <button id="btn-share" class="btn" type="button">Del lenke</button>
            <button id="btn-gpx" class="btn" type="button">Last ned GPX</button>
            <label class="btn btn--file">
              Åpne GPX
              <input id="input-gpx" type="file" accept=".gpx,application/gpx+xml" class="visually-hidden" />
            </label>
          </div>
          <p class="credits">
            Kart og høyder: <a href="https://www.kartverket.no/" target="_blank" rel="noopener">Kartverket</a> ·
            Stier: Turrutebasen og
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ·
            Vær: <a href="https://www.met.no/" target="_blank" rel="noopener">MET</a> ·
            Skred: <a href="https://varsom.no/" target="_blank" rel="noopener">Varsom / NVE</a>
          </p>
        </footer>
      </aside>
    </main>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="src/js/main.js"></script>
    <noscript>
      <p class="noscript">Turplan trenger JavaScript for å tegne kart og regne ut ruter.</p>
    </noscript>
  </body>
</html>
