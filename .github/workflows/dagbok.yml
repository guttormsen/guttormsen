# Egen arbeidsflyt for dagbok/. Den kjører bare når noe i den mappa
# endrer seg, og rører ikke turappen – se CLAUDE.md i rota.
name: Dagbok

on:
  push:
    paths: ['dagbok/**', '.github/workflows/dagbok.yml']
  pull_request:
    paths: ['dagbok/**', '.github/workflows/dagbok.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Enhetstester
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dagbok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Testene bruker node --test og node:sqlite. Ingenting å installere.
      - run: npm test
